[project]
name = "autoseguro-agent"
version = "0.1.0"
description = "Agente de WhatsApp da AutoSeguro: qualifica, cota pelo /quote e decide handoff (desafio FDE Namastex)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "httpx>=0.28",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "tenacity>=9.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoseguro_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "contract: chama o quote-service real (pula se ele não estiver no ar)",
    "chaos: teste de caos com falha alta e QUOTE_SEED (make chaos)",
    "golden: golden set contra a API estável (make golden)",
]
addopts = "-m 'not chaos and not golden'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos e aspas em português são intencionais

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["autoseguro_agent"]
plugins = ["pydantic.mypy"]
